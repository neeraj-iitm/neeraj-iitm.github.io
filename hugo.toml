baseURL = 'https://neeraj-iitm.github.io/'
locale = 'en-us'
title = 'Neeraj Sahu'
theme = 'hugo-profile'
ignoreLogs = ['warning-goldmark-raw-html']

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

[[menu.main]]
name = 'Data'
url = '/data'
weight = 1

[[menu.main]]
name = 'Music'
url = '/music'
weight = 2

[[menu.main]]
name = 'Management'
url = '/management'
weight = 3

[[menu.main]]
name = 'Wind'
url = '/wind'
weight = 4

[params]
  description = 'Personal website and notes for   data, music, management, and wind.'
  favicon = '/fav.png'

  # Keep the theme's base palette dark as well as its dark-class components.
  [params.color]
    textColor = '#e4e6eb'
    secondaryTextColor = '#b0b3b8'
    textLinkColor = '#ffffff'
    backgroundColor = '#18191a'
    secondaryBackgroundColor = '#212529'
    primaryColor = '#ffffff'
    secondaryColor = '#212529'

  [params.theme]
    defaultTheme = 'dark'
    disableThemeToggle = true

  [params.navbar]
    brandName = 'Neeraj Sahu'
    [params.navbar.menus]
      disableAbout = false
      disableExperience = true
      disableEducation = true
      disableProjects = true
      disableAchievements = true
      disableContact = true

  [params.hero]
    enable = true
    intro = 'Hi, I’m'
    title = 'Neeraj'
    subtitle = 'I write about data, sound, and practical systems'
    content = 'This site is my personal knowledge base for notes, ideas, and experiments across     data, music, management, and wind.'
    image = '/images/me.png'
    roundImage = true
    [params.hero.button]
      enable = true
      name = 'Browse posts'
      url = '/data'
      download = false
      newPage = false

  [params.about]
    enable = true
    title = 'About'
    image = '/images/my_photo.jpg'
    content = """
I’m a curious builder who likes to organize learning in public.

This site gathers my writing across four areas I continue to explore: data, music, management, and wind.
"""
    [params.about.skills]
      enable = true
      title = 'Focus areas'
      items = ['Data', 'Music', 'Management', 'Wind']
